name: Folgen rendern

on:
  push:
    paths:
      - "episoden/**"
      - "audio/**"
      - "musik/**"
      - "engine/**"
      - "figuren.json"
      - "render.mjs"
      - "drehbuch.mjs"
      - "der-alien/episoden/**"
      - "der-alien/audio/**"
      - "der-alien/figuren.json"
  workflow_dispatch:
    inputs:
      folge:
        description: "z.B. folge-01 oder der-alien-folge-01 (leer = alle Folgen)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  auswahl:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.w.outputs.liste }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: w
        run: |
          # Einträge sind Pfade ohne .txt, z.B. episoden/folge-01 oder der-alien/episoden/folge-01
          alle() { ls $1 2>/dev/null | sed 's/\.txt$//'; }
          ALLE="$(alle 'episoden/folge-*.txt') $(alle 'der-alien/episoden/folge-*.txt')"
          if [ -n "${{ github.event.inputs.folge }}" ]; then
            L=""
            for f in ${{ github.event.inputs.folge }}; do
              case "$f" in
                */*) L="$L $f" ;;
                der-alien-*) L="$L der-alien/episoden/${f#der-alien-}" ;;
                *) L="$L episoden/$f" ;;
              esac
            done
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            L="$ALLE"
          else
            G=$(git diff --name-only HEAD~1 HEAD || true)
            if echo "$G" | grep -qE '^(engine/|figuren.json|render.mjs|drehbuch.mjs)'; then
              L="$ALLE"
            else
              L=$(echo "$G" | grep -E '^(der-alien/)?episoden/folge-.*\.txt$' | sed 's/\.txt$//')
              for d in $(echo "$G" | grep -E '^audio/' | cut -d/ -f2 | sort -u); do L="$L episoden/$d"; done
              for d in $(echo "$G" | grep -E '^der-alien/audio/' | cut -d/ -f3 | sort -u); do L="$L der-alien/episoden/$d"; done
              if echo "$G" | grep -q '^der-alien/figuren.json'; then L="$L $(alle 'der-alien/episoden/folge-*.txt')"; fi
            fi
          fi
          J=$(echo $L | tr ' ' '\n' | sort -u | grep . | jq -R . | jq -sc .)
          echo "liste=$J" >> "$GITHUB_OUTPUT"
          echo "Rendere: $J"

  rendern:
    needs: auswahl
    if: needs.auswahl.outputs.liste != '[]' && needs.auswahl.outputs.liste != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        folge: ${{ fromJson(needs.auswahl.outputs.liste) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Rendern
        id: r
        run: |
          node render.mjs "${{ matrix.folge }}.txt" --teile
          # Ausgabename wie in render.mjs: folge-01 oder der-alien-folge-01
          echo "name=$(echo '${{ matrix.folge }}' | sed 's#^episoden/##; s#/episoden/#-#')" >> "$GITHUB_OUTPUT"
      - name: Als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.r.outputs.name }}
        run: |
          tag="$NAME-v${{ github.run_number }}"
          { echo "Automatisch gerendert. Ganze Folge plus Teile für TikTok/Insta (je max. 1 Minute):"; echo; cat "ausgabe/$NAME-teile.txt"; } > notes.txt
          gh release create "$tag" "ausgabe/$NAME.mp4" ausgabe/$NAME-teil-*.mp4 --title "$NAME (Version ${{ github.run_number }})" --notes-file notes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.r.outputs.name }}
          path: |
            ausgabe/${{ steps.r.outputs.name }}.mp4
            ausgabe/${{ steps.r.outputs.name }}-teil-*.mp4
            ausgabe/${{ steps.r.outputs.name }}-teile.txt
