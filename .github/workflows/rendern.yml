name: Folge rendern

on:
  push:
    paths:
      - "episoden/**"
      - "audio/**"
      - "musik/**"
  workflow_dispatch:
    inputs:
      folge:
        description: "Episoden-Datei, z.B. folge-01 (leer = alle)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  rendern:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Welche Folgen?
        id: welche
        run: |
          if [ -n "${{ github.event.inputs.folge }}" ]; then
            LISTE="episoden/${{ github.event.inputs.folge }}.json"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LISTE=$(ls episoden/*.json)
          else
            GEAENDERT=$(git diff --name-only HEAD~1 HEAD || true)
            LISTE=$(echo "$GEAENDERT" | grep -E '^episoden/.*\.json$' || true)
            # Neue Audios -> zugehörige Folge neu rendern
            for d in $(echo "$GEAENDERT" | grep -E '^audio/' | cut -d/ -f2 | sort -u); do
              [ -f "episoden/$d.json" ] && LISTE="$LISTE episoden/$d.json"
            done
          fi
          LISTE=$(echo $LISTE | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "liste=$LISTE" >> "$GITHUB_OUTPUT"
          echo "Rendere: $LISTE"

      - name: Rendern
        if: steps.welche.outputs.liste != ''
        run: |
          for f in ${{ steps.welche.outputs.liste }}; do
            node render.mjs "$f"
          done

      - name: Als Download bereitstellen (Release)
        if: steps.welche.outputs.liste != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in ${{ steps.welche.outputs.liste }}; do
            id=$(basename "$f" .json)
            tag="$id-v${{ github.run_number }}"
            gh release create "$tag" "ausgabe/$id.mp4" --title "$id (Version ${{ github.run_number }})" --notes "Automatisch gerendert aus $f"
          done

      - uses: actions/upload-artifact@v4
        if: steps.welche.outputs.liste != ''
        with:
          name: videos
          path: ausgabe/*.mp4
