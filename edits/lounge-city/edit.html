// Songtext-Edit „Lounge City“ (Pashanim), Intro + Hook + 2 Lines, 0–26,05 s. 1080×1920 logisch, gerendert in 1440×2560.

async function init() {

  for (const [k, v] of Object.entries(namen)) IMG[k] = await lade(`assets/${v}.jpg`);
  IMG.tee = await lade("assets/tee.png"); IMG.album = await lade("assets/album.png");
  for (let i = 0; i < 96; i++) CAP.push(await lade(`cap/${String(i).padStart(3, "0")}.png`));
  await document.fonts.load('900 100px "Titel"'); await document.fonts.load('700 40px "UI"');
  // Filmkorn vorbereiten
  for (let k = 0; k < 6; k++) { const g = document.createElement("canvas"); g.width = 540; g.height = 960; const c = g.getContext("2d"), d = c.createImageData(540, 960);
    for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 22; } c.putImageData(d, 0, 0); KORN.push(g); }

}
const KORN = [];

// ---------- Bausteine ----------
function cover(img, zoom = 1, ox = 0, oy = 0, filter = "none", alpha = 1) {

  ctx.save(); ctx.globalAlpha = alpha; ctx.filter = filter; ctx.drawImage(img, (W - w) / 2 + ox, (H - h) / 2 + oy, w, h); ctx.restore();
}

// Wörter erscheinen genau, wenn sie gesungen werden. stil: {y, groesse, farbe, akzent, breite, glitch, riesig}
function zeile(T, z, stil = {}) {
  const fs = stil.groesse || 112, y0 = stil.y ?? 1420, maxB = stil.breite || 960, sx = 0.86;

  const leer = fs * 0.28, reihen = []; let r = [], br = 0;

  for (const reihe of reihen) {

    for (const w of reihe) {

        ctx.lineJoin = "round"; ctx.lineWidth = fs * 0.16; ctx.strokeStyle = "rgba(0,0,0,0.92)"; ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10; ctx.strokeText(w.t, 0, 0); ctx.shadowColor = "transparent";

        ctx.restore();

}

// Handy (realistisch: Rahmen, Dynamic Island, Glas-Reflex), Inhalt per Funktion

}

  ctx.restore(); blitz(T, z.a, 0.18, 0.95);

      const f = k === 0 ? clamp((T - z.a) / (z.e - z.a), 0, 1) : 0; if (f > 0) { rr(x + 18 + k * (w - 36) / 3, y + 70, ((w - 36) / 3 - 6) * f, 5, 3); ctx.fillStyle = "#fff"; ctx.fill(); } }
    const ag = ctx.createLinearGradient(x + 20, y + 90, x + 80, y + 150); ag.addColorStop(0, "#f9ce34"); ag.addColorStop(0.5, "#ee2a7b"); ag.addColorStop(1, "#6228d7");
    ctx.beginPath(); ctx.arc(x + 52, y + 122, 28, 0, Math.PI * 2); ctx.fillStyle = ag; ctx.fill(); ctx.beginPath(); ctx.arc(x + 52, y + 122, 23, 0, Math.PI * 2); ctx.fillStyle = "#222"; ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "700 26px UI"; ctx.textBaseline = "middle"; ctx.fillText("pashanim", x + 92, y + 116); ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "700 22px UI"; ctx.fillText("2 Min.", x + 92 + ctx.measureText("pashanim").width + 46, y + 117);

    const tp = z.woerter[5].a; ctx.save(); ctx.font = "700 24px UI"; const lb = ctx.measureText("Werbung").width + 30; rr(x + 92, y + 140, lb, 36, 8); ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillText("Werbung", x + 107, y + 159); const q = clamp((T - tp) / 0.2, 0, 1); if (q > 0) { ctx.strokeStyle = "#ff3b5c"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x + 98, y + 159); ctx.lineTo(x + 98 + (lb - 12) * q, y + 159); ctx.stroke(); } ctx.restore();
    rr(x + 20, y + h - 90, w - 130, 60, 30); ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "700 22px UI"; ctx.fillText("Nachricht senden", x + 44, y + h - 59);
  }, Math.sin(T * 1.3) * 0.02);

}
function schwarzlicht(T, z) {
  cover(IMG.uv, 1.1, 0, 0, "brightness(0.35) saturate(1.6) hue-rotate(-10deg)");
  ctx.fillStyle = "rgba(40,0,90,0.45)"; ctx.fillRect(0, 0, W, H);
  const an = T > z.woerter[0].e - 0.1 ? 1 : clamp((T - z.a) / 0.3, 0, 1) * (Math.sin(T * 70) > 0 ? 1 : 0.4);
  const t = IMG.tee, s = 820 / t.width, w = t.width * s, h = t.height * s, x = W / 2 - w / 2, y = 760 - h / 2 + Math.sin(T * 2) * 8;
  // UV-Leuchten: violett eingefärbt, Kanten glühen
  const off = document.createElement("canvas"); off.width = w; off.height = h; const o = off.getContext("2d"); o.drawImage(t, 0, 0, w, h);
  o.globalCompositeOperation = "multiply"; o.fillStyle = "#c9a8ff"; o.fillRect(0, 0, w, h); o.globalCompositeOperation = "destination-in"; o.drawImage(t, 0, 0, w, h);
  ctx.save(); ctx.globalAlpha = an; ctx.shadowColor = "#b77bff"; ctx.shadowBlur = 90; ctx.drawImage(off, x, y); ctx.shadowBlur = 40; ctx.globalCompositeOperation = "screen"; ctx.drawImage(off, x, y); ctx.restore();
  vignette(0.6); zeile(T, z, { akzent: "#d9a8ff" });
}
function aendern(T, z) {
  const p = (T - z.a) / (z.e - z.a); cover(IMG.berlin2, 1.15 + p * 0.06, 0, 0, "grayscale(0.85) brightness(0.6) contrast(1.2)");
  if (Math.floor(T * 12) % 5 === 0) { const y = rnd(Math.floor(T * 12)) * H; ctx.drawImage(cv, 0, y * K, cv.width, 60 * K, 18, y, W, 60); }
  vignette(0.7); zeile(T, z, { glitch: true });
}

  const tE = z.woerter[2].a, netz = T < tE ? 3 : (T < tE + 0.3 ? (Math.floor(T * 20) % 2 ? 1 : 0) : 0);

function melden(T, z) {

}
function hotel(T, z) {
