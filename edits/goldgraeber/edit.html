const SZENEN = () => [s01, s02, s03, s04, s05, s06, s07, s08, s09, s10, s11, s12, s13, s14, s15, s16, s17, s18, s19, s20];
const SZ_CLIP = [null, "auto1", null, null, "kripo", null, "zimmer", null, null, "auto2", "uhr", "auto4", null, null, "graffiti", "party", null, null, "auto3", null];
let GRENZEN = null, ZS = null;
function vorbereiten() { const Z = ZL.zeilen; GRENZEN = Z.map(z => z.a); GRENZEN[0] = 0; GRENZEN.push(ZL.ende + 1); ZS = SZENEN().map((f, i) => ({ f, z: { ...Z[i], a: GRENZEN[i], e: GRENZEN[i + 1] } })); }
function szeneNr(T) { let nr = 0; for (let i = 0; i < ZS.length; i++) if (T >= GRENZEN[i]) nr = i; return nr; }
window.laden = async T => { if (!ZS) vorbereiten(); const nr = szeneNr(T), noetig = new Set([nr - 1, nr, nr + 1].map(i => SZ_CLIP[i]).filter(Boolean));
  for (const k in CL) if (!noetig.has(k) && CL[k].img) CL[k].img = null; for (const k of noetig) await clipLaden(k); };
function szeneIn(nr, T, puf) { const alt = ctx; ctx = puf.getContext("2d"); ctx.setTransform(K, 0, 0, K, 0, 0); ctx.filter = "none"; ctx.globalAlpha = 1; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const s = ZS[clamp(nr, 0, ZS.length - 1)]; s.f(T, s.z); ctx = alt; }
const RICHT = [[0, 1], [1, 0], [0, -1], [-1, 0]];
function stossJetzt(T) { let st = 0; for (const k of ZL.kicks) { const ph = T - k; if (ph >= 0 && ph < 0.4) st = Math.max(st, Math.exp(-ph / 0.09) * 0.02); } return st; }
window.zeichne = T => {
  if (!ZS) vorbereiten();
  ctx = HAUPT; ctx.setTransform(K, 0, 0, K, 0, 0); ctx.filter = "none"; ctx.globalAlpha = 1; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const GR = GRENZEN, nr = szeneNr(T); const UE = 0.1; let g = -1; for (let i = 1; i < ZS.length; i++) if (Math.abs(T - GR[i]) < UE) g = i;
  const st = stossJetzt(T);
  const male = (puf, dx, dy, a = 1) => { ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2 + dx, H / 2 + dy); ctx.scale(1 + st, 1 + st); ctx.drawImage(puf, -W / 2, -H / 2, W, H); ctx.restore(); };
  if (g < 0) { szeneIn(nr, T, PUF[0]); male(PUF[0], 0, 0); }
  else { const p = (T - (GR[g] - UE)) / (2 * UE), e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, [rx, ry] = RICHT[g % RICHT.length], v = Math.sin(Math.PI * clamp(p, 0, 1));
    szeneIn(g - 1, Math.min(T, GR[g] - 0.001), PUF[0]); szeneIn(g, Math.max(T, GR[g]), PUF[1]);
    for (const [puf, off] of [[PUF[0], -e], [PUF[1], 1 - e]]) { const dx = off * W * rx, dy = off * H * ry; if (Math.abs(off) >= 1) continue; male(puf, dx, dy, 1); for (let s2 = 1; s2 <= 4; s2++) male(puf, dx - rx * s2 * 30 * v, dy - ry * s2 * 52 * v, 0.14 * v); } }
  ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.drawImage(KORN[Math.floor(T * 24) % KORN.length], 0, 0, W, H); ctx.restore();
};
