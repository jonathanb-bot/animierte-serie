# Hörprobe im Serien-Stil (Vorlage): eine tiefe, zügige Erzählstimme in Du-Form, dunkler Drone,
# harte Stille-Schnitte, Wort-für-Wort-Untertitel, HUD.  Bauen:  python -m ton folgen/demo/ton.yaml --vorschau
titel: "24. Stock – Hörprobe"
stil: kurzgeschichte

kapitel:
  - titel: Stromausfall
    musik: dunkel
    hud: {tag: 1, uhr: "21:40", uhr_bis: "21:41", anzeige: "Wasser", wert: 1.0, text: "voll"}
    atmo: [kuehlschrank]
    ablauf:
      - erzaehler: "Dienstagabend. Vierundzwanzigster Stock."
      - erzaehler: "Dann wird es *still*."
        emotion: spannend
      - sfx: stromausfall
      - atmo_stop: kuehlschrank
      - schnitt: 0.5
      - erzaehler: "Kein Licht. Kein Kühlschrank. *Kein Netz*."
        emotion: ernst
      - einblendung: "Kein Netz"
        versatz: -0.9

  - titel: Wasser
    musik: dunkel
    hud: {uhr: "21:43", uhr_bis: "21:46", wert: 0.7, text: "70 %"}
    ablauf:
      - erzaehler: "Dein erster Gedanke ist das Handy. Falsch."
      - erzaehler: "Denk an das *Wasser*."
        emotion: ernst
      - sfx: wasser_stockt
        pegel: 3
      - erzaehler: "So weit oben kommt es nur mit Pumpen an. Und die brauchen Strom."
        emotion: erklaerend
      - erzaehler: "Du hast vielleicht noch _zehn Minuten_."
        emotion: spannend
      - einblendung: "Badewanne voll"
        farbe: gelb
        dauer: 2.0
      - erzaehler: "Also: Stöpsel rein. Badewanne voll laufen lassen. Jetzt."
        emotion: aufgeregt
      - sfx: badewanne
        dauer: 4
        pegel: -2

  - titel: Treppenhaus
    musik: dunkel_puls
    hud: {uhr: "22:10", uhr_bis: "22:12", wert: 0.95, text: "95 %"}
    ablauf:
      - schnitt: 0.45
      - erzaehler: "Zweiundzwanzig Uhr zehn. Jemand ist im *Treppenhaus*."
        emotion: spannend
      - sfx: schritte
        dauer: 3
        ort: treppenhaus
        pegel: -4
      - erzaehler: "Eine Frauenstimme. Leise. Hallo? Ist da oben noch jemand?"
        emotion: leise
      - erzaehler: "Sie wohnt einen Stock unter dir. Sie heißt _Mara_."
      - sfx: zombie
        ort: treppenhaus
        pegel: -6
      - erzaehler: "Und von ganz unten... *antwortet etwas*."
        emotion: dramatisch
      - schnitt: 0.6

  - titel: Überlebens-Check
    musik: dunkel
    hud: aus
    ablauf:
      - einblendung: "Überlebens-Check"
        dauer: 2.0
      - erzaehler: "Überlebens-Check."
        emotion: ernst
      - erzaehler: "Was denkst du: Was passiert als Nächstes?"
        emotion: fragend
      - erzaehler: "Und wie würdest du reagieren? A: Licht aus und ganz still sein. B: _Mara_ reinholen. C: Erst das Wasser sichern."
      - erzaehler: "Schreib es in die Kommentare."
      - pause: 1.2
