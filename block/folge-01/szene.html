sh(wz("Millionen", 3) - 0.1, (t, q) => { const b = V(HOCH.x, HOCH.h + 1, HOCH.z); const a = 1.2 + t * 0.45; Wt.suchkegel[0].visible = true; Wt.suchkegel[0].userData.richte(b, b.clone().add(V(Math.sin(a) * 400, 800, Math.cos(a) * 400)));
